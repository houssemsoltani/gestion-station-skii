apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestion-station-skii-deployment
  labels:
    app: gestion-station-skii
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gestion-station-skii
  template:
    metadata:
      labels:
        app: gestion-station-skii
    spec:
      containers:
      - name: gestion-station-skii
        image: gestion-station-skii:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8087
        livenessProbe:
          httpGet:
            path: /stationSki/actuator/health
            port: 8087
          initialDelaySeconds: 40
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /stationSki/actuator/health
            port: 8087
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
      restartPolicy: Always
